name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "11.0.x"

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Integration/**"
      - "Directory.Packages*.props"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - ".github/package-smoke/**"
      - ".github/scripts/run-specifications.sh"
      - ".github/scripts/run-specifications.test.mjs"
      - ".github/scripts/compare-specifications.mjs"
      - ".github/scripts/compare-specifications.test.mjs"
      - "Choreography.slnx"
      - "global.json"
      - ".github/workflows/dotnet-build.yml"
      - ".github/workflows/grain-compatibility.yml"

jobs:
  # Fails a change to a grain interface that silos of the latest release could not call during a rolling upgrade.
  grain-compatibility:
    uses: ./.github/workflows/grain-compatibility.yml

  build:
    needs: [grain-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRATIS_CHOREOGRAPHY_SPECS_POSTGRESQL: "Host=localhost;Port=5432;Username=postgres;Database=postgres"
    # Integration specs use real MongoDB, PostgreSQL and SQL Server instances.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Start SQL Server
        run: |
          password="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$password"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "CRATIS_CHOREOGRAPHY_SPECS_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$password;TrustServerCertificate=True;Encrypt=False" >> "$GITHUB_ENV"

      # Built once, in Release like publish (warnings as errors); every later step runs the built output.
      - name: Build
        run: dotnet build --configuration Release

      - name: Verify specification runner
        run: bash .github/scripts/run-specifications.sh --self-test

      - name: Verify specification parity comparison
        run: node .github/scripts/compare-specifications.mjs --self-test

      - name: Wait for SQL Server
        run: |
          for _ in $(seq 90); do
            if docker logs mssql 2>&1 | grep -q 'SQL Server is now ready for client connections'; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 50 mssql
          exit 1

      # The runner executes the eight xUnit v3 test programs one at a time and fails on a missing project, a missing
      # or empty result, or a nonzero exit, so a run that discovers nothing cannot pass. It never builds.
      - name: Run specifications (ordinary and integration)
        run: bash .github/scripts/run-specifications.sh Release --results TestResults/candidate

      - name: Verify packed Orleans dependencies for supported frameworks
        run: bash .github/package-smoke/verify.sh

      # The build above compiles net11.0 only. Published libraries also target net10.0, so build them the way publish
      # does, for every packaged target framework. This runs last so the specification outputs above stay untouched.
      - name: Build packaged libraries for every target framework
        run: dotnet build --configuration Release -p:IsPackaging=true -p:CratisProxiesOutputPath=

      - name: Upload specification results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specification-results
          path: TestResults/
          if-no-files-found: ignore
