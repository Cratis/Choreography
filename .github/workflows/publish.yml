name: Publish

# Keep up to 100 pending Publish runs in FIFO order with `queue: max` (Cratis/Direct#1517).
# The default single pending slot drops the older pending release when a third merge arrives.
# Runs remain serialized and in-flight releases are never cancelled.
# Omit `cancel-in-progress`: GitHub rejects it together with `queue: max`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET8_VERSION: "8.0.410"
  DOTNET9_VERSION: "9.0.x"
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: 'choice'
        options:
        - info
        - warning
        - debug
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
  # A push to main always runs with a full-permission token, and the release action finds the merged pull
  # request and its label from the commit.
  push:
    # Only main releases. On "**" every base branch released, so merging one pull request into another one's
    # branch — the ordinary way to stack work — cut and published a version from a branch that was still in
    # review. A release must come from the branch that is released.
    branches:
      - main
    paths:
      - "Source/**"
      # Changes to the publish pipeline itself should be exercised by a release.
      - ".github/workflows/publish.yml"
      # Central package management decides what the published packages depend on, so a version bump here
      # changes what a consumer restores even though no file under Source changed.
      - "Directory.Packages*.props"
      - "Directory.Build.props"
      - "Directory.Build.targets"

permissions:
  issues: write
  contents: write

jobs:
  # Checked before the release job, so a packed Cratis.Choreography whose consumers resolve mixed Orleans versions
  # (Reminders vs Server) or fail to restore or build for net8.0, net9.0 or net10.0 fails the run before a version
  # is tagged, rather than after, when only the package push would be stopped.
  verify-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Verify packed Orleans dependencies for supported frameworks
        run: bash .github/package-smoke/verify.sh

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [verify-packages]
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  # A release whose grain contracts the previous release cannot call would stall every rolling upgrade of a product
  # built on it. Checked against the release before the one being cut. See grain-compatibility.yml.
  grain-compatibility:
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    uses: ./.github/workflows/grain-compatibility.yml
    with:
      version: ${{ needs.release.outputs.version }}

  publish-dotnet-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, grain-compatibility]
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Build
        run: dotnet build --configuration Release -p:IsPackaging=true -p:Version=${{ needs.release.outputs.version }} -p:CratisProxiesOutputPath=

      - name: Create NuGet packages
        run: |
          find ./Source -name "*.csproj" ! -name "*.Specs.csproj" -print0 | while IFS= read -r -d '' project; do
            dotnet pack "$project" --no-build --configuration Release -o ${{ env.NUGET_OUTPUT }} -p:IsPackaging=true -p:Version=${{ needs.release.outputs.version }} -p:PackageVersion=${{ needs.release.outputs.version }} -p:SourceRevisionId=${{ github.sha }}
          done

      - name: Setup NuGet (trusted publishing; no API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  # @cratis/choreography ships with every release, at the release's version - the committed package.json always says
  # 1.0.0. It publishes the way Arc's npm packages do: npm trusted publishing (OIDC), so no token is stored here. The
  # package's trusted publisher on npmjs.com must name this repository and this workflow file.
  publish-npm-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release, grain-compatibility]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: Source/JavaScript

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm for OIDC-based publishing
        run: |
          # setup-node writes a placeholder _authToken into .npmrc and exports NODE_AUTH_TOKEN with the same
          # placeholder. npm uses it as-is for registry auth and the registry answers 404. Remove it so npm falls
          # back to OIDC.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Upgrade npm for trusted publishing (requires 11.5.1 or newer)
        run: |
          npm install -g npm@11
          node -e "
            const [major, minor, patch] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error('npm 11.5.1 or newer is required for trusted publishing, got ' + [major, minor, patch].join('.'));
              process.exit(1);
            }
          "

      - name: Install
        run: corepack enable && yarn install --immutable

      - name: Type check, specs and build
        run: yarn ci

      - name: Stamp the release version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public

      - name: Wait until the version is visible on npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS "https://registry.npmjs.org/@cratis%2fchoreography" | node -e "
              let body = ''; process.stdin.on('data', chunk => body += chunk).on('end', () => process.exit(Object.hasOwn(JSON.parse(body).versions ?? {}, process.env.VERSION) ? 0 : 1));
            "; then
              echo "@cratis/choreography $VERSION is visible on npm."
              exit 0
            fi
            sleep 15
          done
          echo "::error::@cratis/choreography $VERSION did not become visible on npm."
          exit 1

  verify-published:
    # A merged pull request that publishes nothing is the failure mode that silently costs a release: the release
    # job succeeds, the publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did. workflow_dispatch is excluded
    # because a manual run may legitimately resolve to no publish. A pull request labelled no-release published
    # nothing on purpose - it changed no shipped behavior - and verify-pull-request-policy guarantees the label is a
    # deliberate choice rather than an omission, which is what makes it safe to trust here.
    if: always() && github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::The release action reported should-publish: false for a merge to main, so no packages were published and no release was cut. The usual cause is a missing major, minor or patch label - see verify-pull-request-policy."
          exit 1
